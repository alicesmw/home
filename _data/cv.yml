cv:
  name: Alice Wong
  label: Assistant Lecturer, Department of Philosophy, The University of Hong Kong
  email: alicesmw@hku.hk
  location: Hong Kong SAR
  image: ""
  summary: >-
    Ph.D. computational scientist working at the intersection of cognitive neuroscience, philosophy of mind, and
    machine learning. My research probes the boundaries of human agency — how actions are initiated, when we
    experience them as our own, and what that tells us about biological versus machine computation.


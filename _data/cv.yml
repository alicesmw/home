    Interdisciplinary Projects:
      - name: Psilocybin microdosing in healthy volunteers
        start_date: 2019
        end_date: 2021
        highlights:
          - Led a small team of assistants to navigate complex logistical and legal structures in order to obtain approval to conduct research with Schedule I drugs.
          - Communicated with multiple U.S. state, federal, and institutional stakeholders to identify and address key ethical, legal, and safety issues in the research proposal.

      - name: Creating a low-latency closed-loop TMS-EMG experiment
        start_date: 2019
        end_date: 2021
        highlights:
          - Worked closely with a biomedical engineer to create a low-latency, real-time, closed-loop, self-initiated non-invasive brain stimulation setup.
          - Designed the experimental setup, collected data from 60+ participants, and analysed the psychological and physiological signals.
          - Featured on PBS NOVA.

